name: Compilar APK Nitro (Android + iPhone PWA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17 (Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validar www/index.html e gerar configurações do Nitro
        run: |
          mkdir -p www
          if [ ! -f www/index.html ] && [ -f lotus.html ]; then
            cp lotus.html www/index.html
          elif [ ! -f www/index.html ] && [ -f index.html ]; then
            cp index.html www/index.html
          fi
          if [ ! -f www/index.html ]; then
            echo "ERRO: Arquivo www/index.html não encontrado!"
            exit 1
          fi

          # Remove eventuais marcadores ```html copiados por engano
          node << 'EOF'
          const fs = require('fs');
          let s = fs.readFileSync('www/index.html', 'utf8').trim();
          s = s.replace(/^```html\s*/i, '').replace(/\s*```$/i, '');
          fs.writeFileSync('www/index.html', s);
          EOF

          if ! grep -q "gl-canvas" www/index.html; then
            echo "ERRO: Seu www/index.html não está com o código novo do Nitro!"
            exit 1
          fi

          cat << 'EOF' > package.json
          {
            "name": "nitro-analog",
            "version": "1.4.0",
            "private": true,
            "description": "Nitro — Filtro Analógico 3D LUT para Android e iPhone",
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/core": "6.1.2"
            },
            "devDependencies": {
              "@capacitor/cli": "6.1.2",
              "tailwindcss": "3.4.15"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nitro.analog",
            "appName": "Nitro",
            "webDir": "www",
            "backgroundColor": "#050505",
            "android": {
              "backgroundColor": "#050505",
              "allowMixedContent": true
            }
          }
          EOF

      - name: Instalar ferramentas e embutir fonte Talks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick unzip zip

          FONT_SRC=$(find . -maxdepth 3 -not -path './android/*' -not -path './node_modules/*' -not -path './www/*' \(-iname '*talks*.ttf' -o -iname '*talks*.otf'\) | head -n 1)
          if [ -z "$FONT_SRC" ]; then
            mkdir -p /tmp/talks_font
            if curl -fsSL -A "Mozilla/5.0" "https://dl.dafont.com/dl/?f=talks" -o /tmp/talks_font/talks.zip; then
              unzip -oq /tmp/talks_font/talks.zip -d /tmp/talks_font || true
              FONT_SRC=$(find /tmp/talks_font \(-iname '*.ttf' -o -iname '*.otf'\) | head -n 1)
            fi
          fi

          if [ -n "$FONT_SRC" ]; then
            EXT_LOWER=$(echo "${FONT_SRC##*.}" | tr '[:upper:]' '[:lower:]')
            cp "$FONT_SRC" "www/Talks.${EXT_LOWER}"
            echo "Fonte Talks embutida em www/Talks.${EXT_LOWER}"
          else
            echo "Aviso: Talks.ttf não encontrado; usando fallback condensado."
          fi

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Compilar Tailwind CSS offline e configurar Auto-Update (OTA)
        run: |
          cat << 'EOF' > tailwind.config.js
          module.exports = {
            darkMode: 'class',
            content: ['./www/**/*.html'],
            theme: {
              extend: {
                fontFamily: {
                  talks: ['"Talks"', '"Bebas Neue"', 'sans-serif'],
                  sans: ['Inter', 'system-ui', 'sans-serif'],
                  mono: ['"JetBrains Mono"', 'monospace'],
                },
                transitionTimingFunction: {
                  lotus: 'cubic-bezier(0.22, 1, 0.36, 1)',
                },
              },
            },
          };
          EOF
          printf "@tailwind base;\n@tailwind components;\n@tailwind utilities;\n" > tailwind.input.css
          npx tailwindcss -i tailwind.input.css -o www/tailwind.css --minify

          BUILD_ID="${GITHUB_SHA:0:7}-$(date -u +%Y%m%d%H%M%S)"
          OTA_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/ota-latest"
          echo "BUILD_ID=${BUILD_ID}" >> "$GITHUB_ENV"

          BUILD_ID="$BUILD_ID" OTA_BASE="$OTA_BASE" node << 'EOF'
          const fs = require('fs');
          let h = fs.readFileSync('www/index.html', 'utf8');
          h = h.replace('<script src="https://cdn.tailwindcss.com"></script>', '<link rel="stylesheet" href="./tailwind.css" />');
          const cfg = `<script>window.__NITRO_BUILD_ID__="${process.env.BUILD_ID}";window.__NITRO_OTA_BASE__="${process.env.OTA_BASE}";</script>`;
          if (h.includes('<!-- NITRO_OTA_CONFIG -->')) {
            h = h.replace('<!-- NITRO_OTA_CONFIG -->', cfg);
          } else {
            h = h.replace('</head>', cfg + '\n</head>');
          }
          fs.writeFileSync('www/index.html', h);
          EOF

          (cd www && zip -qr ../nitro-ota.zip .)
          cat << EOF > version.json
          {
            "version": "${BUILD_ID}",
            "zipUrl": "${OTA_BASE}/nitro-ota.zip"
          }
          EOF

      - name: Publicar atualização automática (OTA) no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ota-latest >/dev/null 2>&1; then
            gh release upload ota-latest version.json nitro-ota.zip --clobber
          else
            gh release create ota-latest version.json nitro-ota.zip \
              --title "Nitro OTA (Auto-Update)" \
              --notes "Pacote de atualização automática do app Nitro."
          fi

      - name: Montar versão iPhone (PWA Offline)
        run: |
          rm -rf pages_dist
          mkdir -p pages_dist
          cp -r www/. pages_dist/
          rm -rf pages_dist/.github
          touch pages_dist/.nojekyll

          ICON_SRC=$(find . -maxdepth 2 -not -path './android/*' -not -path './node_modules/*' -not -path './pages_dist/*' -iname '*nitro*.png' | head -n 1)
          if [ -z "$ICON_SRC" ]; then
            ICON_SRC=$(find . -maxdepth 2 -not -path './android/*' -not -path './node_modules/*' -not -path './pages_dist/*' -iname '*.png' | head -n 1)
          fi

          if [ -n "$ICON_SRC" ]; then
            ALPHA=$(convert "$ICON_SRC" -alpha extract -crop 1x1+0+0 +repage -format "%[fx:mean]" info: 2>/dev/null || echo "1")
            IS_TRANSPARENT=$(awk "BEGIN {print ($ALPHA < 0.5) ? 1 : 0}")

            for spec in "apple-touch-icon.png:180:118" "icon-192.png:192:126" "icon-512.png:512:336"; do
              fname="${spec%%:*}"
              rest="${spec#*:}"
              sz="${rest%%:*}"
              inner="${rest#*:}"
              if [ "$IS_TRANSPARENT" -eq 1 ]; then
                convert "$ICON_SRC" -trim +repage -resize "${inner}x${inner}" -background "#FFFFFF" -alpha remove -alpha off -gravity center -extent "${sz}x${sz}" "pages_dist/${fname}"
              else
                convert "$ICON_SRC" -fuzz 2% -trim +repage -resize "${inner}x${inner}" -background "#FFFFFF" -gravity center -extent "${sz}x${sz}" "pages_dist/${fname}"
              fi
            done
          fi

          cat << 'EOF' > pages_dist/manifest.webmanifest
          {
            "name": "Nitro",
            "short_name": "Nitro",
            "description": "Filtros analógicos 3D LUT em qualidade original",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#050505",
            "theme_color": "#050505",
            "icons": [
              { "src": "./icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
              { "src": "./icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
            ]
          }
          EOF

          BUILD_ID="$BUILD_ID" node << 'EOF'
          const fs = require('fs');
          const files = fs.readdirSync('pages_dist')
            .filter((f) => f !== 'sw.js' && f !== '.nojekyll')
            .map((f) => './' + f);
          const assets = ['./', ...files];
          const sw = `
          const CACHE_NAME = 'nitro-${process.env.BUILD_ID}';
          const ASSETS = ${JSON.stringify(assets)};

          self.addEventListener('install', (event) => {
            event.waitUntil(
              caches.open(CACHE_NAME)
                .then((cache) => cache.addAll(ASSETS))
                .then(() => self.skipWaiting())
            );
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', (event) => {
            if (event.request.method !== 'GET') return;
            const url = new URL(event.request.url);
            if (url.origin !== self.location.origin) return;

            if (event.request.mode === 'navigate') {
              event.respondWith(
                fetch(event.request)
                  .then((res) => {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then((c) => c.put('./index.html', copy));
                    return res;
                  })
                  .catch(() => caches.match('./index.html'))
              );
              return;
            }

            event.respondWith(
              caches.match(event.request).then((cached) => {
                if (cached) return cached;
                return fetch(event.request).then((res) => {
                  if (res && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then((c) => c.put(event.request, copy));
                  }
                  return res;
                });
              })
            );
          });
          `.trim() + '\n';
          fs.writeFileSync('pages_dist/sw.js', sw);
          EOF

      - name: Preparar artefato para o GitHub Pages (iPhone)
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_dist

      - name: Criar e sincronizar projeto Android (Capacitor)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Instalar plugins nativos (Galeria + Photo Picker + Auto-Update OTA) e ícone Nitro clean
        run: |
          JAVA_DIR="android/app/src/main/java/com/nitro/analog"
          mkdir -p "$JAVA_DIR"

          cat << 'EOF' > "$JAVA_DIR/NitroGalleryPlugin.java"
          package com.nitro.analog;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.ImageDecoder;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.util.Base64;

          import androidx.activity.result.ActivityResult;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Comparator;
          import java.util.List;

          @CapacitorPlugin(name = "NitroGallery")
          public class NitroGalleryPlugin extends Plugin {

              private String queryDisplayName(ContentResolver resolver, Uri uri, String fallback) {
                  try (Cursor cursor = resolver.query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null)) {
                      if (cursor != null && cursor.moveToFirst()) {
                          int idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) {
                              String name = cursor.getString(idx);
                              if (name != null && !name.trim().isEmpty()) {
                                  return name.trim();
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return fallback;
              }

              private void cleanupOldCache(File dir, int maxFiles) {
                  File[] files = dir.listFiles();
                  if (files == null || files.length <= maxFiles) return;
                  Arrays.sort(files, Comparator.comparingLong(File::lastModified));
                  for (int i = 0; i < files.length - maxFiles; i++) {
                      files[i].delete();
                  }
              }

              @PluginMethod
              public void pickPhotos(PluginCall call) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          Intent pick = new Intent(MediaStore.ACTION_PICK_IMAGES);
                          pick.setType("image/*");
                          int maxLimit = Math.min(20, MediaStore.getPickImagesMaxLimit());
                          if (maxLimit > 1) {
                              pick.putExtra(MediaStore.EXTRA_PICK_IMAGES_MAX, maxLimit);
                          }
                          startActivityForResult(call, pick, "handlePickPhotosResult");
                          return;
                      }
                  } catch (Exception ignored) {}

                  try {
                      Intent fallback = new Intent(Intent.ACTION_GET_CONTENT);
                      fallback.addCategory(Intent.CATEGORY_OPENABLE);
                      fallback.setType("image/*");
                      fallback.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                      startActivityForResult(call, Intent.createChooser(fallback, "Escolher foto"), "handlePickPhotosResult");
                  } catch (Exception e) {
                      call.reject("Não foi possível abrir a galeria: " + e.getMessage(), e);
                  }
              }

              @ActivityCallback
              private void handlePickPhotosResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;

                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      JSObject ret = new JSObject();
                      ret.put("photos", new JSArray());
                      call.resolve(ret);
                      return;
                  }

                  final Intent data = result.getData();
                  final List<Uri> uris = new ArrayList<>();

                  ClipData clip = data.getClipData();
                  if (clip != null && clip.getItemCount() > 0) {
                      for (int i = 0; i < clip.getItemCount(); i++) {
                          Uri u = clip.getItemAt(i).getUri();
                          if (u != null) uris.add(u);
                      }
                  } else if (data.getData() != null) {
                      uris.add(data.getData());
                  }

                  if (uris.isEmpty()) {
                      JSObject ret = new JSObject();
                      ret.put("photos", new JSArray());
                      call.resolve(ret);
                      return;
                  }

                  new Thread(() -> {
                      try {
                          ContentResolver resolver = getContext().getContentResolver();
                          File cacheDir = new File(getContext().getCacheDir(), "nitro_picked");
                          if (!cacheDir.exists()) cacheDir.mkdirs();

                          JSArray photosArr = new JSArray();
                          long stamp = System.currentTimeMillis();

                          for (int i = 0; i < uris.size(); i++) {
                              Uri uri = uris.get(i);
                              String mime = resolver.getType(uri);
                              String displayName = queryDisplayName(resolver, uri, "foto_" + (i + 1) + ".jpg");

                              boolean isHeif = mime != null && (mime.toLowerCase().contains("heic") || mime.toLowerCase().contains("heif"));
                              String ext = ".jpg";
                              if (!isHeif && mime != null) {
                                  String lower = mime.toLowerCase();
                                  if (lower.contains("png")) ext = ".png";
                                  else if (lower.contains("webp")) ext = ".webp";
                              }

                              File outFile = new File(cacheDir, "img_" + stamp + "_" + i + ext);

                              if (isHeif && Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                  ImageDecoder.Source src = ImageDecoder.createSource(resolver, uri);
                                  Bitmap bmp = ImageDecoder.decodeBitmap(src);
                                  try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                      bmp.compress(Bitmap.CompressFormat.JPEG, 98, fos);
                                      fos.flush();
                                  }
                                  bmp.recycle();
                              } else {
                                  try (InputStream in = resolver.openInputStream(uri);
                                       FileOutputStream fos = new FileOutputStream(outFile)) {
                                      if (in == null) continue;
                                      byte[] buf = new byte[16384];
                                      int n;
                                      while ((n = in.read(buf)) != -1) {
                                          fos.write(buf, 0, n);
                                      }
                                      fos.flush();
                                  }
                              }

                              JSObject item = new JSObject();
                              item.put("path", outFile.getAbsolutePath());
                              item.put("name", displayName);
                              photosArr.put(item);
                          }

                          cleanupOldCache(cacheDir, 30);

                          JSObject ret = new JSObject();
                          ret.put("photos", photosArr);
                          call.resolve(ret);
                      } catch (Exception e) {
                          call.reject("Erro ao carregar foto: " + e.getMessage(), e);
                      }
                  }).start();
              }

              @PluginMethod
              public void pickCubeFile(PluginCall call) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("*/*");
                      startActivityForResult(call, intent, "handlePickCubeResult");
                  } catch (Exception e) {
                      call.reject("Não foi possível abrir arquivos: " + e.getMessage(), e);
                  }
              }

              @ActivityCallback
              private void handlePickCubeResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;

                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                      JSObject ret = new JSObject();
                      ret.put("text", "");
                      call.resolve(ret);
                      return;
                  }

                  final Uri uri = result.getData().getData();
                  new Thread(() -> {
                      try {
                          ContentResolver resolver = getContext().getContentResolver();
                          String name = queryDisplayName(resolver, uri, "Custom.cube");
                          try (InputStream in = resolver.openInputStream(uri);
                               ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                              if (in == null) {
                                  call.reject("Falha ao abrir arquivo.");
                                  return;
                              }
                              byte[] buf = new byte[8192];
                              int n;
                              int total = 0;
                              while ((n = in.read(buf)) != -1) {
                                  total += n;
                                  if (total > 15 * 1024 * 1024) {
                                      call.reject("Arquivo .CUBE muito grande.");
                                      return;
                                  }
                                  out.write(buf, 0, n);
                              }
                              JSObject ret = new JSObject();
                              ret.put("name", name);
                              ret.put("text", new String(out.toByteArray(), StandardCharsets.UTF_8));
                              call.resolve(ret);
                          }
                      } catch (Exception e) {
                          call.reject("Erro ao ler .CUBE: " + e.getMessage(), e);
                      }
                  }).start();
              }

              @PluginMethod
              public void saveToGallery(PluginCall call) {
                  final String base64 = call.getString("base64");
                  final String filename = call.getString("filename", "nitro-photo.jpg");
                  final String album = call.getString("album", "Nitro");

                  if (base64 == null || base64.isEmpty()) {
                      call.reject("Imagem vazia.");
                      return;
                  }

                  new Thread(() -> {
                      try {
                          int commaIndex = base64.indexOf(',');
                          String pureBase64 = commaIndex >= 0 ? base64.substring(commaIndex + 1) : base64;
                          byte[] bytes = Base64.decode(pureBase64, Base64.DEFAULT);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = getContext().getContentResolver();
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Images.Media.DISPLAY_NAME, filename);
                              values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                              values.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + File.separator + album);
                              values.put(MediaStore.Images.Media.IS_PENDING, 1);

                              Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) {
                                  call.reject("Não foi possível gravar na galeria.");
                                  return;
                              }

                              try (OutputStream out = resolver.openOutputStream(uri)) {
                                  if (out == null) {
                                      call.reject("Falha ao abrir arquivo na galeria.");
                                      return;
                                  }
                                  out.write(bytes);
                                  out.flush();
                              }

                              values.clear();
                              values.put(MediaStore.Images.Media.IS_PENDING, 0);
                              resolver.update(uri, values, null, null);

                              JSObject ret = new JSObject();
                              ret.put("uri", uri.toString());
                              ret.put("album", album);
                              call.resolve(ret);
                          } else {
                              File picturesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES);
                              File albumDir = new File(picturesDir, album);
                              if (!albumDir.exists()) {
                                  albumDir.mkdirs();
                              }
                              File imageFile = new File(albumDir, filename);
                              try (FileOutputStream fos = new FileOutputStream(imageFile)) {
                                  fos.write(bytes);
                                  fos.flush();
                              }

                              MediaScannerConnection.scanFile(
                                  getContext(),
                                  new String[]{imageFile.getAbsolutePath()},
                                  new String[]{"image/jpeg"},
                                  null
                              );

                              JSObject ret = new JSObject();
                              ret.put("uri", Uri.fromFile(imageFile).toString());
                              ret.put("album", album);
                              call.resolve(ret);
                          }
                      } catch (Exception e) {
                          call.reject("Erro ao salvar na galeria: " + e.getMessage(), e);
                      }
                  }).start();
              }
          }
          EOF

          cat << 'EOF' > "$JAVA_DIR/NitroUpdaterPlugin.java"
          package com.nitro.analog;

          import android.app.Activity;
          import android.content.SharedPreferences;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import org.json.JSONObject;

          import java.io.BufferedInputStream;
          import java.io.BufferedOutputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          @CapacitorPlugin(name = "NitroUpdater")
          public class NitroUpdaterPlugin extends Plugin {

              private static final String PREFS_OTA = "NitroOTA";
              private static final String PREFS_CAP = "CapWebViewSettings";
              private static final String KEY_SERVER_PATH = "serverBasePath";

              private HttpURLConnection openWithRedirects(String urlStr, int maxRedirects) throws IOException {
                  String currentUrl = urlStr;
                  for (int i = 0; i <= maxRedirects; i++) {
                      HttpURLConnection conn = (HttpURLConnection) new URL(currentUrl).openConnection();
                      conn.setInstanceFollowRedirects(false);
                      conn.setConnectTimeout(10000);
                      conn.setReadTimeout(25000);
                      conn.setRequestProperty("User-Agent", "NitroApp-Android");
                      conn.setRequestProperty("Cache-Control", "no-cache");
                      int code = conn.getResponseCode();
                      if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                          String location = conn.getHeaderField("Location");
                          conn.disconnect();
                          if (location == null || location.isEmpty()) {
                              throw new IOException("Redirect sem Location.");
                          }
                          currentUrl = new URL(new URL(currentUrl), location).toString();
                          continue;
                      }
                      if (code != 200) {
                          conn.disconnect();
                          throw new IOException("HTTP " + code);
                      }
                      return conn;
                  }
                  throw new IOException("Muitos redirecionamentos.");
              }

              private String fetchText(String urlStr) throws IOException {
                  HttpURLConnection conn = openWithRedirects(urlStr, 5);
                  try (InputStream in = new BufferedInputStream(conn.getInputStream());
                       ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) != -1) {
                          out.write(buf, 0, n);
                      }
                      return new String(out.toByteArray(), StandardCharsets.UTF_8);
                  } finally {
                      conn.disconnect();
                  }
              }

              private void downloadToFile(String urlStr, File destFile) throws IOException {
                  HttpURLConnection conn = openWithRedirects(urlStr, 5);
                  try (InputStream in = new BufferedInputStream(conn.getInputStream());
                       FileOutputStream fos = new FileOutputStream(destFile)) {
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) != -1) {
                          fos.write(buf, 0, n);
                      }
                      fos.flush();
                  } finally {
                      conn.disconnect();
                  }
              }

              private void unzipSafe(File zipFile, File targetDir) throws IOException {
                  if (!targetDir.exists()) {
                      targetDir.mkdirs();
                  }
                  String canonicalTarget = targetDir.getCanonicalPath() + File.separator;
                  try (ZipInputStream zis = new ZipInputStream(new BufferedInputStream(new FileInputStream(zipFile)))) {
                      ZipEntry entry;
                      byte[] buf = new byte[8192];
                      while ((entry = zis.getNextEntry()) != null) {
                          File outFile = new File(targetDir, entry.getName());
                          String canonicalOut = outFile.getCanonicalPath();
                          if (!canonicalOut.startsWith(canonicalTarget)) {
                              throw new IOException("Caminho inválido no zip.");
                          }
                          if (entry.isDirectory()) {
                              outFile.mkdirs();
                          } else {
                              File parent = outFile.getParentFile();
                              if (parent != null && !parent.exists()) {
                                  parent.mkdirs();
                              }
                              try (BufferedOutputStream bos = new BufferedOutputStream(new FileOutputStream(outFile))) {
                                  int n;
                                  while ((n = zis.read(buf)) != -1) {
                                      bos.write(buf, 0, n);
                                  }
                                  bos.flush();
                              }
                          }
                          zis.closeEntry();
                      }
                  }
              }

              private void deleteRecursive(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) {
                          for (File c : children) {
                              deleteRecursive(c);
                          }
                      }
                  }
                  f.delete();
              }

              @PluginMethod
              public void checkAndUpdate(PluginCall call) {
                  final String versionUrl = call.getString("versionUrl");
                  final String currentVersion = call.getString("currentVersion", "");

                  if (versionUrl == null || versionUrl.isEmpty()) {
                      call.reject("versionUrl ausente.");
                      return;
                  }

                  new Thread(() -> {
                      File tempZip = null;
                      try {
                          String sep = versionUrl.contains("?") ? "&" : "?";
                          String rawJson = fetchText(versionUrl + sep + "t=" + System.currentTimeMillis());
                          JSONObject obj = new JSONObject(rawJson);
                          String remoteVersion = obj.optString("version", "").trim();
                          String zipUrl = obj.optString("zipUrl", "").trim();

                          if (remoteVersion.isEmpty() || zipUrl.isEmpty()) {
                              call.reject("version.json inválido.");
                              return;
                          }

                          SharedPreferences otaPrefs = getContext().getSharedPreferences(PREFS_OTA, Activity.MODE_PRIVATE);
                          String installedOta = otaPrefs.getString("installedVersion", "");

                          if (remoteVersion.equals(currentVersion) || remoteVersion.equals(installedOta)) {
                              JSObject ret = new JSObject();
                              ret.put("updated", false);
                              ret.put("version", remoteVersion);
                              call.resolve(ret);
                              return;
                          }

                          String safeVer = remoteVersion.replaceAll("[^a-zA-Z0-9_-]", "_");
                          File otaRoot = new File(getContext().getFilesDir(), "nitro_ota");
                          if (!otaRoot.exists()) otaRoot.mkdirs();

                          tempZip = new File(otaRoot, "bundle_" + safeVer + ".zip");
                          File targetDir = new File(otaRoot, "v_" + safeVer);
                          if (targetDir.exists()) deleteRecursive(targetDir);

                          downloadToFile(zipUrl + "?t=" + System.currentTimeMillis(), tempZip);
                          unzipSafe(tempZip, targetDir);

                          File indexFile = new File(targetDir, "index.html");
                          if (!indexFile.exists() || indexFile.length() < 2000) {
                              deleteRecursive(targetDir);
                              call.reject("Pacote de atualização incompleto.");
                              return;
                          }

                          String newPath = targetDir.getAbsolutePath();

                          getContext().getSharedPreferences(PREFS_CAP, Activity.MODE_PRIVATE)
                              .edit()
                              .putString(KEY_SERVER_PATH, newPath)
                              .commit();

                          otaPrefs.edit()
                              .putString("installedVersion", remoteVersion)
                              .putString("bundlePath", newPath)
                              .commit();

                          File[] dirs = otaRoot.listFiles();
                          if (dirs != null) {
                              for (File d : dirs) {
                                  if (d.isDirectory() && !d.getAbsolutePath().equals(newPath)) {
                                      deleteRecursive(d);
                                  }
                              }
                          }

                          JSObject ret = new JSObject();
                          ret.put("updated", true);
                          ret.put("version", remoteVersion);
                          call.resolve(ret);
                      } catch (Exception e) {
                          call.reject("OTA falhou: " + e.getMessage(), e);
                      } finally {
                          if (tempZip != null && tempZip.exists()) {
                              tempZip.delete();
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void applyNow(PluginCall call) {
                  SharedPreferences capPrefs = getContext().getSharedPreferences(PREFS_CAP, Activity.MODE_PRIVATE);
                  final String savedPath = capPrefs.getString(KEY_SERVER_PATH, null);
                  if (savedPath == null || savedPath.isEmpty()) {
                      call.reject("Nenhuma atualização pronta.");
                      return;
                  }
                  File indexFile = new File(savedPath, "index.html");
                  if (!indexFile.exists()) {
                      call.reject("Arquivos da atualização não encontrados.");
                      return;
                  }
                  getActivity().runOnUiThread(() -> {
                      getBridge().setServerBasePath(savedPath);
                      call.resolve();
                  });
              }
          }
          EOF

          cat << 'EOF' > "$JAVA_DIR/MainActivity.java"
          package com.nitro.analog;

          import android.content.SharedPreferences;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  try {
                      long apkUpdateTime = getPackageManager().getPackageInfo(getPackageName(), 0).lastUpdateTime;
                      SharedPreferences otaPrefs = getSharedPreferences("NitroOTA", MODE_PRIVATE);
                      SharedPreferences capPrefs = getSharedPreferences("CapWebViewSettings", MODE_PRIVATE);
                      long savedApkTime = otaPrefs.getLong("apkUpdateTime", -1L);

                      if (savedApkTime != apkUpdateTime) {
                          capPrefs.edit().remove("serverBasePath").commit();
                          otaPrefs.edit()
                              .putLong("apkUpdateTime", apkUpdateTime)
                              .remove("installedVersion")
                              .remove("bundlePath")
                              .commit();
                      } else {
                          String savedPath = capPrefs.getString("serverBasePath", null);
                          if (savedPath != null && !savedPath.isEmpty() && !savedPath.equals("public")) {
                              File idx = new File(savedPath, "index.html");
                              if (!idx.exists() || idx.length() < 2000) {
                                  capPrefs.edit().remove("serverBasePath").commit();
                              }
                          }
                      }
                  } catch (Exception ignored) {}

                  registerPlugin(NitroGalleryPlugin.class);
                  registerPlugin(NitroUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          node << 'EOF'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(p, 'utf8');
          const perm = '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />';
          if (!m.includes(perm)) {
            m = m.replace('<application', '    ' + perm + '\n    <application');
          }
          fs.writeFileSync(p, m);
          EOF

          ICON_SRC=$(find . -maxdepth 2 -not -path './android/*' -not -path './node_modules/*' -not -path './pages_dist/*' -iname '*nitro*.png' | head -n 1)
          if [ -z "$ICON_SRC" ]; then
            ICON_SRC=$(find . -maxdepth 2 -not -path './android/*' -not -path './node_modules/*' -not -path './pages_dist/*' -iname 'icon.png' | head -n 1)
          fi
          if [ -z "$ICON_SRC" ]; then
            ICON_SRC=$(find . -maxdepth 2 -not -path './android/*' -not -path './node_modules/*' -not -path './pages_dist/*' -iname '*.png' | head -n 1)
          fi

          if [ -z "$ICON_SRC" ]; then
            echo "ERRO: Envie o arquivo PNG da logo do Nitro para a raiz do repositório!"
            exit 1
          fi

          ICON_BG="#FFFFFF"
          ALPHA=$(convert "$ICON_SRC" -alpha extract -crop 1x1+0+0 +repage -format "%[fx:mean]" info: 2>/dev/null || echo "1")
          IS_TRANSPARENT=$(awk "BEGIN {print ($ALPHA < 0.5) ? 1 : 0}")

          find android/app/src/main/res -name "ic_launcher_foreground.*" -delete
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF

          if [ "$IS_TRANSPARENT" -eq 1 ]; then
            convert "$ICON_SRC" -trim +repage -resize 216x216 -background none -gravity center -extent 432x432 android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          else
            convert "$ICON_SRC" -fuzz 2% -trim +repage -resize 216x216 -background "$ICON_BG" -gravity center -extent 432x432 android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          fi

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dpi="${pair%%:*}"
            sz="${pair##*:}"
            inner=$(( sz * 64 / 100 ))
            dir="android/app/src/main/res/mipmap-${dpi}"
            if [ -d "$dir" ]; then
              if [ "$IS_TRANSPARENT" -eq 1 ]; then
                convert "$ICON_SRC" -trim +repage -resize "${inner}x${inner}" -background "$ICON_BG" -alpha remove -alpha off -gravity center -extent "${sz}x${sz}" "$dir/ic_launcher.png"
              else
                convert "$ICON_SRC" -fuzz 2% -trim +repage -resize "${inner}x${inner}" -background "$ICON_BG" -gravity center -extent "${sz}x${sz}" "$dir/ic_launcher.png"
              fi
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            fi
          done

      - name: Compilar APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Nitro.apk

      - name: Publicar APK pronto para download
        uses: actions/upload-artifact@v4
        with:
          name: Nitro-Android-APK
          path: Nitro.apk
          retention-days: 14

