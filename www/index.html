<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NITRO</title>

  <!-- Tailwind CSS CDN (substituído por CSS offline no APK) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Bebas Neue (fallback visual de Talks), Inter (interface), JetBrains Mono (dados) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              talks: ['"Talks"', '"Bebas Neue"', 'sans-serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            transitionTimingFunction: {
              lotus: 'cubic-bezier(0.22, 1, 0.36, 1)',
            },
          },
        },
      };
    }
  </script>

  <style>
    @font-face {
      font-family: 'Talks';
      src: url('./Talks.ttf') format('truetype'),
           url('./Talks.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ease-lotus: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #050505;
      color: #ffffff;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .font-talks {
      font-family: 'Talks', 'Bebas Neue', sans-serif;
    }

    #app-container {
      height: 100vh;
      height: 100dvh;
    }

    .glass-surface {
      background: rgba(18, 18, 18, 0.84);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-dock {
      background: rgba(18, 18, 18, 0.84);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .compare-surface {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    input[type="range"].lotus-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 24px;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"].lotus-slider::-webkit-slider-runnable-track {
      height: 1.5px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
    }

    input[type="range"].lotus-slider::-moz-range-track {
      height: 1.5px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
    }

    input[type="range"].lotus-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      background: #ffffff;
      margin-top: -5.25px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      transition: transform 220ms var(--ease-lotus), box-shadow 220ms var(--ease-lotus);
    }

    input[type="range"].lotus-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      transition: transform 220ms var(--ease-lotus);
    }

    input[type="range"].lotus-slider:active::-webkit-slider-thumb {
      transform: scale(1.28);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.55);
    }

    /* Altura sempre estável na gaveta de sliders para nunca alterar o tamanho do preview */
    .sliders-drawer {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 280ms var(--ease-lotus), opacity 220ms var(--ease-lotus);
    }
    .sliders-drawer.is-open {
      grid-template-rows: 1fr;
      opacity: 1;
    }
    .sliders-drawer > div {
      overflow: hidden;
    }

    @keyframes canvasFilterPulse {
      0% { opacity: 0.92; }
      100% { opacity: 1; }
    }
    .canvas-pulse {
      animation: canvasFilterPulse 200ms var(--ease-lotus);
    }

    .filter-card {
      transition: transform 220ms var(--ease-lotus), opacity 220ms var(--ease-lotus);
    }
    .filter-card:active {
      transform: scale(0.95);
    }

    .lotus-toast {
      opacity: 0;
      transform: translate(-50%, -10px) scale(0.96);
      pointer-events: none;
      transition: opacity 220ms var(--ease-lotus), transform 280ms var(--ease-lotus);
    }
    .lotus-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }
  </style>
</head>
<body class="bg-[#050505] text-white antialiased flex items-center justify-center">

  <!-- Inputs ocultos para galeria (aceita uma ou várias fotos) e arquivos .CUBE -->
  <input id="photo-input" type="file" accept="image/*" multiple class="hidden" />
  <input id="cube-input" type="file" accept=".cube,.CUBE,text/plain" class="hidden" />

  <!-- Toast de confirmação -->
  <div id="toast" role="status" aria-live="polite" class="lotus-toast fixed top-16 left-1/2 z-50 glass-surface rounded-full px-4 py-2 flex items-center gap-2 shadow-2xl whitespace-nowrap">
    <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
    <span id="toast-message" class="text-[11px] tracking-wide text-white">Pronto</span>
  </div>

  <!-- Container Mobile-First -->
  <div id="app-container" class="relative w-full max-w-[480px] bg-[#050505] md:border-x md:border-white/[0.08] flex flex-col overflow-hidden">

    <!-- Overlay de Drag & Drop (Desktop) -->
    <div id="drop-overlay" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/80 backdrop-blur-xl p-6 pointer-events-none">
      <div class="w-full max-w-xs aspect-[4/5] rounded-3xl glass-surface border-dashed border-white/25 flex flex-col items-center justify-center gap-3 text-center p-6">
        <p class="font-talks text-4xl tracking-[0.14em] text-white uppercase">NITRO</p>
        <p class="text-xs text-[#71717A] leading-relaxed">Solte sua foto ou arquivo 3D LUT (.CUBE)</p>
      </div>
    </div>

    <!-- ======================================================
         TELA 1: TELA INICIAL / GALERIA DO CELULAR
         ====================================================== -->
    <div id="home-screen" class="flex-1 flex flex-col min-h-0 bg-[#050505] z-20">
      <!-- Header da Tela Inicial -->
      <header class="pt-[env(safe-area-inset-top)] border-b border-white/[0.08] bg-[#050505]/95 shrink-0">
        <div class="h-14 px-5 flex items-center justify-between">
          <span class="font-talks text-[28px] leading-none tracking-[0.12em] text-white uppercase select-none">NITRO</span>
          <button id="btn-home-pick-top" type="button" class="px-3.5 py-1.5 rounded-full bg-white text-black text-xs font-medium tracking-wide active:scale-95 transition">
            + Galeria
          </button>
        </div>
      </header>

      <!-- Estado Inicial Vazio: Direciona direto para escolher fotos do celular -->
      <div id="home-empty" class="flex-1 flex flex-col items-center justify-center px-6 py-8 text-center">
        <button id="btn-home-hero" type="button" class="w-full max-w-[320px] aspect-[4/5] rounded-[28px] border border-dashed border-white/15 bg-white/[0.02] hover:bg-white/[0.04] active:scale-[0.98] transition duration-200 ease-lotus flex flex-col items-center justify-center px-6 gap-5">
          <div class="w-16 h-16 rounded-2xl bg-white/[0.06] border border-white/10 flex items-center justify-center text-white">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <path d="m21 15-4.5-4.5a2 2 0 0 0-2.828 0L6 18" />
            </svg>
          </div>
          <div class="space-y-1.5">
            <p class="text-base font-medium text-white tracking-tight">Escolher foto da galeria</p>
            <p class="text-xs text-[#71717A] leading-relaxed">
              Toque para abrir suas fotos do celular e editar em qualidade original
            </p>
          </div>
          <span class="mt-1 px-6 py-2.5 rounded-full bg-white text-black text-xs font-semibold tracking-wide">
            Abrir Galeria
          </span>
        </button>

        <p class="mt-6 text-[10px] font-mono tracking-[0.14em] uppercase text-zinc-600">
          Retro 1 · Retro 2 · La Crème · Fuji · 35mm · Kodak 64
        </p>
      </div>

      <!-- Grade estilo Galeria das fotos abertas na sessão -->
      <div id="home-gallery-wrap" class="hidden flex-1 flex-col min-h-0">
        <div class="px-5 py-3 flex items-center justify-between">
          <span class="text-[11px] uppercase tracking-[0.14em] text-[#71717A]">Recentes</span>
          <span id="home-count" class="font-mono text-[10px] text-zinc-500">0 fotos</span>
        </div>
        <div id="home-grid" class="flex-1 overflow-y-auto px-3 pb-6 grid grid-cols-3 gap-1.5 content-start no-scrollbar"></div>
      </div>
    </div>

    <!-- ======================================================
         TELA 2: EDITOR DE FILTROS (WEBGL)
         ====================================================== -->
    <div id="editor-screen" class="hidden flex-1 flex-col justify-between min-h-0">
      <!-- 1. TOP HEADER -->
      <header class="pt-[env(safe-area-inset-top)] border-b border-white/[0.08] bg-[#050505]/90 backdrop-blur-xl shrink-0 z-20">
        <div class="h-14 px-4 flex items-center justify-between">
          <!-- Botão Galeria (abre seletor de fotos do celular) -->
          <button id="btn-gallery" type="button" class="flex items-center gap-1.5 py-2 px-3 -ml-2 rounded-full text-[#71717A] hover:text-white hover:bg-white/[0.06] active:scale-95 transition duration-200 ease-lotus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="8.5" cy="8.5" r="1.4" />
              <path d="m21 15-4.5-4.5a2 2 0 0 0-2.828 0L6 18" />
            </svg>
            <span class="text-xs tracking-wide font-normal">Galeria</span>
          </button>

          <!-- Centro: Apenas texto NITRO na fonte Talks (sem ícone) + Resolução -->
          <div class="flex flex-col items-center justify-center select-none">
            <span class="font-talks text-[26px] leading-none tracking-[0.12em] text-white uppercase">NITRO</span>
            <span id="res-badge" class="font-mono text-[9px] tracking-[0.12em] text-[#71717A] mt-0.5 leading-none">
              — × —
            </span>
          </div>

          <!-- Direita: Botão Salvar em pílula branca -->
          <button id="btn-save" type="button" disabled class="px-4 py-1.5 rounded-full bg-white text-black text-xs font-medium tracking-wide hover:bg-zinc-200 active:scale-95 disabled:opacity-30 disabled:pointer-events-none transition duration-200 ease-lotus">
            Salvar
          </button>
        </div>
      </header>

      <!-- 2. CENTER VIEWPORT (CANVAS WEBGL + HOLD ORIGINAL) -->
      <main class="relative flex-1 min-h-0 flex flex-col items-center justify-center p-4 overflow-hidden">
        <!-- Pill flutuante ORIGINAL durante comparação -->
        <div id="badge-original" class="pointer-events-none absolute top-4 left-1/2 -translate-x-1/2 z-20 glass-surface rounded-full px-3.5 py-1 opacity-0 scale-95 transition-all duration-200 ease-lotus">
          <span class="font-mono text-[10px] tracking-[0.2em] text-white uppercase">ORIGINAL</span>
        </div>

        <!-- Palco da Fotografia -->
        <div id="canvas-stage" class="compare-surface relative w-full h-full flex items-center justify-center cursor-pointer">
          <canvas id="gl-canvas" class="max-w-full max-h-full w-auto h-auto block rounded-xl shadow-[0_24px_64px_rgba(0,0,0,0.92)] opacity-0 transition-opacity duration-300 ease-lotus"></canvas>

          <!-- Loader discreto -->
          <div id="loading-indicator" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-5 h-5 rounded-full border border-white/20 border-t-white animate-spin"></div>
          </div>

          <!-- Erro visível caso WebGL falhe -->
          <div id="error-box" class="hidden absolute inset-0 flex-col items-center justify-center text-center p-6 gap-2">
            <p class="font-talks text-2xl tracking-widest text-white">ERRO NO MOTOR</p>
            <p id="error-text" class="text-xs text-zinc-400 font-mono break-all"></p>
          </div>
        </div>
      </main>

      <!-- 3. BOTTOM FLOATING DOCK (SLIDERS EM 1 LINHA FIXA + CARROSSEL) -->
      <section class="shrink-0 glass-dock rounded-t-[26px] pt-1 pb-[max(1rem,env(safe-area-inset-bottom))] z-20">
        <!-- Gaveta de Sliders Rápidos (sempre 1 única linha para nunca redimensionar o preview) -->
        <div id="sliders-drawer" class="sliders-drawer">
          <div>
            <div id="sliders-grid" class="px-4 pt-2.5 pb-2 border-b border-white/[0.08] grid grid-cols-2 gap-x-4 items-center">
              <!-- Slider 1: Intensidade -->
              <div class="flex flex-col min-w-0">
                <div class="flex items-center justify-between mb
